services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nina
      POSTGRES_PASSWORD: nina
      POSTGRES_DB: nina
    ports:
      - "5432:5432"
    volumes:
      - nina_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nina -d nina"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nina_pg:
