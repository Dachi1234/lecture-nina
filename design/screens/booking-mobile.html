<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Booking sheet mobile</title>
<link rel="stylesheet" href="../assets/fonts/fonts.css">
<style>
body{margin:0;background:#FCF7E6;color:#0A414F;font-family:'FiraGO','Montserrat',system-ui,sans-serif}
h1,h2,p{margin:0}
.hand{font-family:'Caveat',cursive;font-weight:600;line-height:1}
input,textarea,button{font-family:'FiraGO','Montserrat',sans-serif}
</style>
</head>
<body>

<div style="width: 390px; height: 1180px; overflow: hidden; background: #FCF7E6; display: flex; flex-direction: column">
  <div style="height: 64px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 12px 0 20px; border-bottom: 1px solid #E4D3B4">
    <span class="hand" style="font-size: 30px; color: #841B22">¡Hola!</span>
    <a href="landing-mobile.html" aria-label="დახურვა" style="width: 44px; height: 44px; border-radius: 50%; background: #F1E3C8; color: #0A414F; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
  </div>
  <form style="padding: 22px 20px 28px; display: flex; flex-direction: column; gap: 16px">
    <h1 style="font-size: 26px; line-height: 1.25; font-weight: 700">დაჯავშნე საცდელი გაკვეთილი</h1>
    <p style="font-size: 15px; line-height: 1.55; color: #4A6268">პირველი 2 გაკვეთილი — საჩუქრად. შეავსე ფორმა და ნინა დაგიკავშირდება.</p>
    <div style="display: flex; flex-direction: column; gap: 6px"><label for="m-name" style="font-size: 14px; font-weight: 600">სახელი *</label><input id="m-name" value="მარიამი" style="height: 52px; box-sizing: border-box; padding: 0 14px; border-radius: 12px; border: 1.5px solid #D0AC84; background: #FFFCF3; font-size: 16px; color: #0A414F"></div>
    <div style="display: flex; flex-direction: column; gap: 6px"><label for="m-phone" style="font-size: 14px; font-weight: 600">ტელეფონი *</label><input id="m-phone" type="tel" value="+995 555 12" aria-invalid="true" style="height: 52px; box-sizing: border-box; padding: 0 14px; border-radius: 12px; border: 2px solid #841B22; background: #FFFCF3; font-size: 16px; color: #0A414F"><span style="font-size: 13px; color: #841B22; font-weight: 500">ნომერი არასრულია — error state</span></div>
    <div style="display: flex; flex-direction: column; gap: 6px"><label for="m-email" style="font-size: 14px; font-weight: 600">ელ-ფოსტა <span style="font-weight: 400; color: #4A6268">(არასავალდ.)</span></label><input id="m-email" type="email" placeholder="name@mail.com" style="height: 52px; box-sizing: border-box; padding: 0 14px; border-radius: 12px; border: 1.5px solid #D0AC84; background: #FFFCF3; font-size: 16px"></div>
    <div style="display: flex; flex-direction: column; gap: 8px"><span style="font-size: 14px; font-weight: 600">როგორ დაგიკავშირდე?</span>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <button type="button" style="height: 46px; border-radius: 12px; border: 1.5px solid #D0AC84; background: #FFFCF3; font-size: 15px; color: #0A414F">ტელეფონი</button>
        <button type="button" aria-pressed="true" style="height: 46px; border-radius: 12px; border: 1.5px solid #196166; background: #196166; font-size: 15px; color: #FCF7E6; font-weight: 600">✓ WhatsApp</button>
        <button type="button" style="height: 46px; border-radius: 12px; border: 1.5px solid #D0AC84; background: #FFFCF3; font-size: 15px; color: #0A414F">Telegram</button>
        <button type="button" style="height: 46px; border-radius: 12px; border: 1.5px solid #D0AC84; background: #FFFCF3; font-size: 15px; color: #0A414F">ელ-ფოსტა</button>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px"><span style="font-size: 14px; font-weight: 600">რისთვის გინდა ესპანური?</span>
      <div style="display: flex; gap: 8px; flex-wrap: wrap">
        <button type="button" aria-pressed="true" style="height: 44px; padding: 0 14px; border-radius: 12px; border: 1.5px solid #196166; background: #196166; font-size: 15px; color: #FCF7E6">მოგზაურობა</button>
        <button type="button" style="height: 44px; padding: 0 14px; border-radius: 12px; border: 1.5px solid #D0AC84; background: #FFFCF3; font-size: 15px; color: #0A414F">სწავლა</button>
        <button type="button" style="height: 44px; padding: 0 14px; border-radius: 12px; border: 1.5px solid #D0AC84; background: #FFFCF3; font-size: 15px; color: #0A414F">გადასვლა</button>
        <button type="button" style="height: 44px; padding: 0 14px; border-radius: 12px; border: 1.5px solid #D0AC84; background: #FFFCF3; font-size: 15px; color: #0A414F">გართობისთვის</button>
        <button type="button" style="height: 44px; padding: 0 14px; border-radius: 12px; border: 1.5px solid #D0AC84; background: #FFFCF3; font-size: 15px; color: #0A414F">სხვა</button>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px"><span style="font-size: 14px; font-weight: 600">სასურველი დღეები და დრო</span>
      <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px">
        <button type="button" style="height: 44px; border-radius: 10px; border: 1.5px solid #D0AC84; background: #FFFCF3; font-size: 12px; color: #0A414F">ორშ</button>
        <button type="button" style="height: 44px; border-radius: 10px; border: 1.5px solid #196166; background: #196166; font-size: 12px; color: #FCF7E6">სამ</button>
        <button type="button" style="height: 44px; border-radius: 10px; border: 1.5px solid #D0AC84; background: #FFFCF3; font-size: 12px; color: #0A414F">ოთხ</button>
        <button type="button" style="height: 44px; border-radius: 10px; border: 1.5px solid #196166; background: #196166; font-size: 12px; color: #FCF7E6">ხუთ</button>
        <button type="button" style="height: 44px; border-radius: 10px; border: 1.5px solid #D0AC84; background: #FFFCF3; font-size: 12px; color: #0A414F">პარ</button>
        <button type="button" style="height: 44px; border-radius: 10px; border: 1.5px solid #D0AC84; background: #FFFCF3; font-size: 12px; color: #0A414F">შაბ</button>
        <button type="button" style="height: 44px; border-radius: 10px; border: 1.5px solid #D0AC84; background: #FFFCF3; font-size: 12px; color: #0A414F">კვ</button>
      </div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
        <button type="button" style="height: 44px; border-radius: 12px; border: 1.5px solid #D0AC84; background: #FFFCF3; font-size: 14px; color: #0A414F">დილა</button>
        <button type="button" style="height: 44px; border-radius: 12px; border: 1.5px solid #D0AC84; background: #FFFCF3; font-size: 14px; color: #0A414F">დღე</button>
        <button type="button" style="height: 44px; border-radius: 12px; border: 1.5px solid #196166; background: #196166; font-size: 14px; color: #FCF7E6">საღამო</button>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px"><label for="m-note" style="font-size: 14px; font-weight: 600">შენიშვნა <span style="font-weight: 400; color: #4A6268">(არასავალდ.)</span></label><textarea id="m-note" style="height: 80px; box-sizing: border-box; padding: 12px 14px; border-radius: 12px; border: 1.5px solid #D0AC84; background: #FFFCF3; font-size: 15px; resize: none"></textarea></div>
    <label style="display: flex; gap: 12px; align-items: flex-start; font-size: 14px; line-height: 1.5"><span style="width: 24px; height: 24px; flex-shrink: 0; border-radius: 6px; background: #196166; display: flex; align-items: center; justify-content: center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#FCF7E6" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"></path></svg></span>ვეთანხმები, რომ ნინამ ჩემი მონაცემები გამოიყენოს დასაკავშირებლად *</label>
  </form>
  <div style="margin-top: auto; padding: 14px 20px 24px; border-top: 1px solid #E4D3B4; background: #FCF7E6">
    <a href="booking-mobile-success.html" style="height: 56px; display: flex; align-items: center; justify-content: center; border-radius: 14px; background: #196166; color: #FCF7E6; text-decoration: none; font-weight: 600; font-size: 17px">გაგზავნა</a>
  </div>
</div>


</body>
</html>
