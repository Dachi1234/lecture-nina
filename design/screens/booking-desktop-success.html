<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Booking modal · success</title>
<link rel="stylesheet" href="../assets/fonts/fonts.css">
<style>
body{margin:0;background:#FCF7E6;color:#0A414F;font-family:'FiraGO','Montserrat',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}
.hand{font-family:'Caveat',cursive;font-weight:600;line-height:1}
input,textarea,button{font-family:'FiraGO','Montserrat',sans-serif}
input:focus,textarea:focus{outline:none;border-color:#196166 !important;box-shadow:0 0 0 4px #DCEAE6;background:#FFFFFF !important}
button:focus-visible{outline:3px solid #F5B246;outline-offset:3px}
.chip{cursor:pointer;transition:background-color .15s ease}.chip:hover{border-color:#196166 !important}
.submit:hover{background:#124D51 !important}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin .8s linear infinite}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
.pop{animation:pop .35s ease both}
@media (prefers-reduced-motion:reduce){*{animation:none !important}}
</style>
</head>
<body>

<div style="width: 1440px; height: 1000px; position: relative; overflow: hidden; background: #FCF7E6">
  
  <div style="position: absolute; inset: 0; filter: blur(3px)">
    <div style="position: absolute; left: 80px; top: 180px; font: 700 120px Montserrat, sans-serif; color: #0A414F">Nina</div>
    <div style="position: absolute; left: 80px; top: 320px; font: 700 54px Montserrat, sans-serif; color: #0A414F">Tu Profe de Español</div>
    <img src="../assets/illustrations/nina-standing.webp" alt="" style="position: absolute; left: 860px; top: 130px; height: 760px">
  </div>
  <div style="position: absolute; inset: 0; background: rgba(10,65,79,.55)"></div>

  <div class="pop" role="dialog" aria-modal="true" aria-labelledby="bk-title" style="position: absolute; left: 220px; top: 60px; width: 1000px; height: 880px; border-radius: 24px; background: #FCF7E6; box-shadow: 0 40px 80px -30px rgba(0,0,0,.5); display: flex; overflow: hidden">
    
    <div style="width: 300px; flex-shrink: 0; background: #FCE8C0; position: relative; display: flex; flex-direction: column; padding: 36px 28px; box-sizing: border-box; gap: 14px">
      <div class="hand" style="font-size: 44px; color: #841B22; transform: rotate(-4deg); transform-origin: left">¡Hola!</div>
      <p style="font-size: 17px; line-height: 1.6; font-weight: 500">პირველი 2 გაკვეთილი — საჩუქრად.</p>
      <p style="font-size: 15px; line-height: 1.6; color: #4A6268">შეავსე ფორმა და ნინა თავად დაგიკავშირდება, რომ შეთანხმდეთ დროზე.</p>
      <svg style="position: absolute; left: 30px; bottom: 30px" width="250" height="250" viewBox="0 0 120 120" fill="none" aria-hidden="true"><path d="M96 22 A 50 50 0 1 0 108 70" stroke="#F5B246" stroke-width="3" stroke-linecap="round"></path></svg>
      <img src="../assets/spots/spot-standing.webp" alt="" style="position: absolute; left: 70px; bottom: 16px; height: 440px">
    </div>

    
    <div style="flex-grow: 1; position: relative; padding: 32px 40px; box-sizing: border-box">
      <button aria-label="დახურვა" style="position: absolute; right: 20px; top: 20px; width: 44px; height: 44px; border-radius: 50%; border: 0; background: #F1E3C8; color: #0A414F; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>

      

      
        <div class="pop" role="status" style="height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 18px">
          <div style="position: relative; width: 260px; height: 300px; display: flex; align-items: flex-end; justify-content: center">
            <svg style="position: absolute; inset: 0" width="260" height="300" viewBox="0 0 120 120" preserveAspectRatio="none" fill="none" aria-hidden="true"><path d="M96 22 A 50 50 0 1 0 108 70" stroke="#F5B246" stroke-width="2.5" stroke-linecap="round"></path></svg>
            <img src="../assets/spots/spot-coffee.webp" alt="ნინა ყავით ხელში იღიმება" style="height: 270px; position: relative">
          </div>
          <div class="hand" style="font-size: 48px; color: #841B22">¡Gracias!</div>
          <h2 style="font-size: 32px; line-height: 1.25; font-weight: 700">მადლობა! ნინა მალე დაგიკავშირდება</h2>
          <p style="font-size: 17px; line-height: 1.6; color: #4A6268; max-width: 460px">არხი: WhatsApp · საღამო. ერთად შევთანხმდებით პირველი გაკვეთილის დროზე.</p>
          <button type="button" style="margin-top: 8px; height: 52px; padding: 0 28px; border-radius: 14px; border: 1.5px solid #196166; background: transparent; color: #196166; font-size: 16px; font-weight: 600; cursor: pointer">დახურვა</button>
          <div class="hand" style="font-size: 30px; color: #196166">¡Hasta pronto!</div>
        </div>
      
    </div>
  </div>
</div>


</body>
</html>
